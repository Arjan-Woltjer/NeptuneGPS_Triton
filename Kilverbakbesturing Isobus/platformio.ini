[platformio]
; Kilverbakbesturing on the Ploegbesturing Isobus layout (NeptuneGPS_Triton#286,
; #288). Envs:
;   teensy40_isobus  (default) the Ploegbesturing Teensy 4.0 board the kilverbak
;                    units run (owner, 2026-11-01): ISOBUS through AgIsoStack --
;                    address claim, guidance over CAN, AISO, the debug menu
;   teensy41_isobus  the same on the Teensy 4.1 production board (besturing 0.1)
;   teensy40         Teensy 4.0, serial build: what Kilverbakbesturing does -- the
;                    receiver on the UART plus a listen-only plain CAN bus (ACAN_T4)
;   teensy41_serial  the same on the Teensy 4.1
;   native           the AUnit suite on the host; test\native\run_tests_msvc.ps1
;                    builds the same binary with MSVC on Windows without GCC.
; -D TEENSY40 selects the board branch in the config headers, -D ISOBUS the
; ISOBUS build in main.cpp.
default_envs = teensy40_isobus

; What every board env shares. Not an env itself: the four boards below extend it.
[teensy_base]
platform = teensy
board = teensy41
framework = arduino
; Shared code with sibling Triton projects lives in ../MeijWorks Libs: the
; guidance data model and parsers (VehicleGuidance), the shared ISOBUS layer
; (IsobusImplement, #287) and the small helpers. PlatformIO's LDF picks each
; library there up like any registry dependency.
lib_extra_dirs = ../MeijWorks Libs
monitor_speed = 115200
; -Os (Arduino IDE's "Smallest Code"), as in Ploegbesturing Isobus: AgIsoStack
; hung on the Teensy 4.1 at the default -O2 (confirmed on hardware 2026-08-04,
; see that project's platformio.ini).
build_flags =
    -std=gnu++17
    -D TEENSY_OPT_SMALLEST_CODE
check_tool = cppcheck
; Scope analysis to code we own; see Ploegbesturing Isobus' platformio.ini and
; NeptuneGPS_Triton#32/#33. The shared ISOBUS layer is analysed in
; Ploegbesturing Isobus.
check_src_filters =
    +<src/>
    +<lib/KilverbakbesturingCore/>
check_flags =
    cppcheck: --inline-suppr --suppress=*:*/.pio/libdeps/* --suppress=unusedFunction
; The combined ITCM + DTCM FlexRAM check for the IMXRT1062 (Teensy 4.0 and 4.1),
; copied from Ploegbesturing Isobus.
extra_scripts = post:scripts/extra_script.py

[env:teensy41_isobus]
extends = teensy_base
build_flags =
    ${teensy_base.build_flags}
    -D ISOBUS
; The same AgIsoStack pin as Ploegbesturing Isobus: upstream main 5ff90cb
; (see that project's platformio.ini for why it is no longer our fork).
lib_deps =
    https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git#5ff90cbe7812ae53e90ecdcf52b016afb52bfa45

[env:teensy40_isobus]
extends = env:teensy41_isobus
board = teensy40
build_flags =
    ${env:teensy41_isobus.build_flags}
    -D TEENSY40

[env:teensy41_serial]
extends = teensy_base
lib_deps =
    pierremolinaro/ACAN_T4@^1.1.8

[env:teensy40]
extends = teensy_base
board = teensy40
build_flags =
    ${teensy_base.build_flags}
    -D TEENSY40
lib_deps =
    pierremolinaro/ACAN_T4@^1.1.8

; Native (host-compiled) AUnit test suite, as Kilverbakbesturing's: the
; scraper's implement, interface and calibration persistence. The shared
; ISOBUS and guidance libraries have their suites in Ploegbesturing Isobus.
; test/native/support/ is a small, self-contained set of Arduino-shaped stubs;
; see test/README.
[env:native]
platform = native
; See Kilverbakbesturing's platformio.ini: every include path is explicit.
lib_ldf_mode = off
build_flags =
    -std=gnu++17
    ; AUnit's Assertion.cpp casts a pointer to unsigned long, a hard GCC error
    ; under Windows' LLP64 model; harmless upstream code.
    -fpermissive
    -D EPOXY_DUINO=1
    -I test/native/support
    -I .pio/libdeps/native/AUnit/src
    -I lib/KilverbakbesturingCore/src
    -I "../MeijWorks Libs/EepromStore"
    -I "../MeijWorks Libs/Interpolation"
    -I "../MeijWorks Libs/LcdNumber"
    -I "../MeijWorks Libs/TritonText"
    -I "../MeijWorks Libs/ButtonPair"
    -I "../MeijWorks Libs/EndShutoff"
    -I "../MeijWorks Libs/VehicleGuidance"
lib_deps =
    bxparks/AUnit@^1.7.1
build_src_filter =
    -<*>
    +<../test/native/KilverbakbesturingIsobusNativeTests.cpp>
    +<../test/native/support/native_main.cpp>
    +<../test/native/tests/*.cpp>
    +<../.pio/libdeps/native/AUnit/src/aunit/*.cpp>
    +<../lib/KilverbakbesturingCore/src/implement/ImplementScraper.cpp>
    +<../lib/KilverbakbesturingCore/src/InterfaceScraper.cpp>
    +<../lib/KilverbakbesturingCore/src/calibration/CalibrationScraper.cpp>
    +<../lib/KilverbakbesturingCore/src/calibration/ScraperSettings.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/NmeaParser.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/TrimbleParser.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/CanSerialParser.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/SerialGuidanceChannel.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/IsobusPgnDecode.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/CanFrameGuidanceChannel.cpp>
