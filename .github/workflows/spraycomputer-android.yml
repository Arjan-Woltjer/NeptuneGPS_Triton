name: SprayComputer Android app

# Builds the companion app's debug APK and runs its JVM unit tests. Scoped to
# the app directory so firmware-only pushes do not spin up an Android SDK.

on:
  push:
    branches: [main]
    paths:
      - "Spuitcomputer LD/android/**"
      - ".github/workflows/spraycomputer-android.yml"
  pull_request:
    paths:
      - "Spuitcomputer LD/android/**"
      - ".github/workflows/spraycomputer-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "Spuitcomputer LD/android"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools"; the legacy "tools"
          # package left the SDK repository and sdkmanager 16 fails on it.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Nothing ran lint until now, which is how a WrongConstant error in
      # SprayerBleClient sat there unnoticed (NeptuneGPS_Triton#145). Lint
      # aborts on errors only; warnings stay visible in the report without
      # failing the build.
      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: spraycomputer-lint-report
          path: "Spuitcomputer LD/android/app/build/reports/lint-results-debug.html"
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: spraycomputer-debug-apk
          path: "Spuitcomputer LD/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: spraycomputer-unit-test-report
          path: "Spuitcomputer LD/android/app/build/reports/tests/testDebugUnitTest"
