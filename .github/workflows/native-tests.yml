name: Native tests and firmware builds

# SECURITY: this workflow must stay on `pull_request`, never `pull_request_target`.
# `Ploegbesturing Isobus` sets `extra_scripts = post:scripts/extra_script.py`, so a
# build executes repository Python. Under `pull_request` a fork PR runs with a
# read-only GITHUB_TOKEN and no access to repository secrets; `pull_request_target`
# would run that same fork-controlled code with secrets and a writable token.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than floating: an unpinned `pip install -U platformio` lets an
  # upstream release break CI with no change in this repository.
  PLATFORMIO_VERSION: '6.1.19'

jobs:
  # Host-compiled AUnit suites. Each project builds a single combined binary
  # (`[env:native]`) per FIRMWARE_PLATFORMIO_CONVENTIONS.md §5 and is run directly --
  # `pio test` ignores `test_framework = custom` and never picks up AUnit correctly.
  native-tests:
    name: Native tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - 'Loofdoes Spuitcomputer'
          - 'Ploegbesturing'
          - 'Ploegbesturing Isobus'
          - 'Motorcontroller'
    steps:
      # Motorcontroller/lib/SteeringActuator is a submodule of the private
      # Arjan-Woltjer/SteeringActuator repo -- the default GITHUB_TOKEN below only has
      # access to this repo, not that one, so submodule fetch needs its own read-only
      # deploy key over SSH instead. A no-op for every other project in this matrix (none
      # of them have submodules), so it's set up once here rather than per-project.
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.STEERING_ACTUATOR_DEPLOY_KEY }}

      # Scoped to exactly this one URL, not "https://github.com/" generally -- a blanket
      # rewrite would also redirect the main repo's own checkout below onto this deploy
      # key, which has no access to it and fails with "Repository not found."
      - name: Use SSH for the SteeringActuator submodule
        run: git config --global url."git@github.com:Arjan-Woltjer/SteeringActuator.git".insteadOf "https://github.com/Arjan-Woltjer/SteeringActuator.git"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            ${{ matrix.project }}/.pio/libdeps
          key: pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
          restore-keys: pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-

      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Build AUnit test suite
        run: pio run -d "${{ matrix.project }}" -e native

      # Single-quoted inside the YAML string: YAML consumes the outer double quotes,
      # so an unquoted path word-splits on the space in every project directory name.
      - name: Run AUnit test suite
        run: '"./${{ matrix.project }}/.pio/build/native/program"'

  # Nothing built the real firmware before, so a change that breaks a board build
  # was invisible until someone flashed it by hand.
  firmware-build:
    name: Firmware build (${{ matrix.project }} / ${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: 'Loofdoes Spuitcomputer'
            env: esp32dev
          - project: 'Ploegbesturing'
            env: teensy41
          - project: 'Ploegbesturing Isobus'
            env: teensy41_isobus
          - project: 'Ploegbesturing Isobus'
            env: teensy41_serial
          - project: 'Motorcontroller'
            env: seeed_xiao
    steps:
      # See the native-tests job above for why this is needed: Motorcontroller/lib/
      # SteeringActuator is a submodule of a private repo the default GITHUB_TOKEN can't
      # reach. No-op for every other project/env pair in this matrix.
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.STEERING_ACTUATOR_DEPLOY_KEY }}

      # Scoped to exactly this one URL, not "https://github.com/" generally -- a blanket
      # rewrite would also redirect the main repo's own checkout below onto this deploy
      # key, which has no access to it and fails with "Repository not found."
      - name: Use SSH for the SteeringActuator submodule
        run: git config --global url."git@github.com:Arjan-Woltjer/SteeringActuator.git".insteadOf "https://github.com/Arjan-Woltjer/SteeringActuator.git"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            ${{ matrix.project }}/.pio/libdeps
          key: pio-fw-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ matrix.env }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
          restore-keys: pio-fw-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Build firmware
        run: pio run -d "${{ matrix.project }}" -e "${{ matrix.env }}"

  # Static analysis, and it gates merges. It used to be advisory (continue-on-error)
  # because the reports were unreadable: `pio check` defaults to src_dir/include_dir, so
  # every project's core library went unanalysed while third-party headers pulled in
  # through our own includes filled the output -- 683 of 687 findings in Ploegbesturing
  # Isobus, including both HIGH ones. check_src_filters plus a path suppression fixed
  # that in each platformio.ini (#32, #33); every project here now reports 0 HIGH and
  # 0 MEDIUM, so there is no backlog left to excuse a non-blocking job.
  #
  # --fail-on-defect high still gates on HIGH only. MEDIUM and LOW are reported but do
  # not block, which is deliberate: a new MEDIUM should be visible without breaking an
  # unrelated PR. Tightening to medium is a real option now that all nine projects sit
  # at zero.
  static-analysis:
    name: cppcheck (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - 'Loofdoes Spuitcomputer'
          - 'Ploegbesturing'
          - 'Ploegbesturing Isobus'
          - 'Motorcontroller'
          - 'Pootmachinebesturing'
          - 'Slangenpomp Spuitcomputer'
          - 'Kilverbakbesturing'
          - 'Kipperbesturing'
          - 'Rooierbesturing'
    steps:
      # Motorcontroller/lib/SteeringActuator is a submodule of a private repo the default
      # GITHUB_TOKEN cannot reach, and MotorcontrollerCore does `#include
      # <SteeringActuator.hpp>` -- cppcheck needs the headers present to parse, even
      # though check_src_filters excludes that library from analysis. No-op for every
      # other project in this matrix. Same pattern as the two jobs above.
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.STEERING_ACTUATOR_DEPLOY_KEY }}

      - name: Use SSH for the SteeringActuator submodule
        run: git config --global url."git@github.com:Arjan-Woltjer/SteeringActuator.git".insteadOf "https://github.com/Arjan-Woltjer/SteeringActuator.git"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Run cppcheck
        run: pio check -d "${{ matrix.project }}" --skip-packages --fail-on-defect high
