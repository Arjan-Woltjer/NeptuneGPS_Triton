name: SprayComputer Android release

# Builds the signed release bundle (AAB) for Google Play from a version tag
# `spraycomputer-vX.Y.Z` (NeptuneGPS_Triton#63). The upload key comes from four
# repository secrets:
#   SPRAYCOMPUTER_UPLOAD_KEYSTORE_B64   base64 of the .jks
#   SPRAYCOMPUTER_UPLOAD_KEY_ALIAS
#   SPRAYCOMPUTER_UPLOAD_KEY_PASSWORD
#   SPRAYCOMPUTER_UPLOAD_STORE_PASSWORD
# versionName is the tag without its prefix, versionCode the workflow run
# number plus 100 (codes 1-100 are reserved for hand-built uploads, the
# first internal-testing bundle was code 1), so every tag build is a
# strictly newer upload. The bundle is kept
# as a workflow artifact; uploading it to the Play internal track is a manual
# step until a Play service account exists.

on:
  push:
    tags:
      - "spraycomputer-v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for a manual build (e.g. 1.0.0-rc1)"
        required: true
        default: "0.0.0-manual"

permissions:
  contents: read

jobs:
  release:
    name: Signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "Spuitcomputer LD/android"
    env:
      SPRAYCOMPUTER_VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools"; the legacy "tools"
          # package left the SDK repository and sdkmanager 16 fails on it.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive versionName and versionCode
        run: |
          echo "SPRAYCOMPUTER_VERSION_NAME=${SPRAYCOMPUTER_VERSION_NAME#spraycomputer-v}" >> "$GITHUB_ENV"
          echo "SPRAYCOMPUTER_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Write the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.SPRAYCOMPUTER_UPLOAD_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.SPRAYCOMPUTER_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPRAYCOMPUTER_UPLOAD_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.SPRAYCOMPUTER_UPLOAD_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SPRAYCOMPUTER_UPLOAD_KEYSTORE_B64 is not set; refusing to build an unsigned release"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "SPRAYCOMPUTER_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build signed release bundle
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: spraycomputer-release-aab-${{ env.SPRAYCOMPUTER_VERSION_NAME }}
          path: "Spuitcomputer LD/android/app/build/outputs/bundle/release/app-release.aab"
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: spraycomputer-release-mapping-${{ env.SPRAYCOMPUTER_VERSION_NAME }}
          path: "Spuitcomputer LD/android/app/build/outputs/mapping/release/mapping.txt"
          if-no-files-found: error
