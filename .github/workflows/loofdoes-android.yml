name: Loofdoes Android app

# Builds the companion app's debug APK and runs its JVM unit tests. Scoped to
# the app directory so firmware-only pushes do not spin up an Android SDK.

on:
  push:
    branches: [main]
    paths:
      - "Loofdoes Spuitcomputer/android/**"
      - ".github/workflows/loofdoes-android.yml"
  pull_request:
    paths:
      - "Loofdoes Spuitcomputer/android/**"
      - ".github/workflows/loofdoes-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "Loofdoes Spuitcomputer/android"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: loofdoes-debug-apk
          path: "Loofdoes Spuitcomputer/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: loofdoes-unit-test-report
          path: "Loofdoes Spuitcomputer/android/app/build/reports/tests/testDebugUnitTest"
