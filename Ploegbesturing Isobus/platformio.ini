[platformio]
; Build/Upload default to teensy41_isobus; run the AUnit tests explicitly with
; "pio run -e native" (produces a runnable .exe under .pio/build/native/program.exe),
; or test\native\run_tests_msvc.ps1 on Windows without GCC.
;
; Historical board variants (Arduino Uno, Arduino Micro, Teensy 3.2, Teensy 3.6,
; Teensy 4.0) are NOT given a buildable env in this pass -- this module has genuinely
; run on all of them at different times, so their pin-config #ifdef branches stay in
; ConfigPlough.hpp/ConfigImplementPlough.hpp/ConfigInterfacePlough.hpp for future
; revival rather than being deleted. Only teensy41 (today's production board, matching
; Salacia's) gets a real env today -- as two variants, see below -- plus
; teensy40_isobus for the Teensy 4.0 board (-D TEENSY40).
default_envs = teensy41_isobus

; Shared template -- every real board target (teensy41_isobus, teensy41_serial)
; extends this rather than duplicating platform/board/framework/build settings.
; Not meant to be built directly, mirroring Salacia's own [env:teensy41] base +
; [env:teensy41_jupiter]/[env:teensy41_neptune01] variant pattern.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; Shared code with sibling Triton projects lives in ../MeijWorks Libs, referenced
; instead of copied per-project -- PlatformIO's LDF picks each library there up
; like any registry dependency.
lib_extra_dirs = ../MeijWorks Libs
monitor_speed = 115200
; AgIsoStack-Arduino's own README (Troubleshooting: "My Teensy won't start up
; after loading this library, or otherwise does nothing") warns that
; non-default optimization can cause exactly this failure mode on the Teensy
; core, and separately recommends "Smallest Code" optimization when RAM1 is
; tight. Confirmed on hardware 2026-08-04: a verbatim reference-example build
; (AgIsoStack Reference Test/, matching examples/SpeedMessages) hung/faulted
; on this exact besturing 0.1 Teensy 4.1 at the default -O2 ("Faster"), and
; started working as soon as -D TEENSY_OPT_SMALLEST_CODE (-Os --specs=nano.specs,
; PlatformIO's equivalent of Arduino IDE's Tools > Optimize > "Smallest Code")
; was added -- with no other code changes. This, not the control-function
; construction pattern, was the real root cause of this project's own
; unresolved CAN bring-up instability.
build_flags =
    -std=gnu++17
    -D TEENSY_OPT_SMALLEST_CODE
; No -I entries into PloegbesturingCore/src's own subdirectories (isobus/,
; calibration/, config/, implement/) -- every cross-file include inside the
; library is a relative path (e.g. "../implement/ImplementPlough.hpp"),
; matching Salacia's SalaciaFirmwareCore convention, so none of them depend
; on a search path at all. main.cpp (the one external entry point on this
; env) uses library-root-relative paths ("isobus/IsobusGuidanceChannel.hpp",
; etc.), resolved by PlatformIO's LDF automatically adding
; lib/PloegbesturingCore/src once main.cpp's own include chain references the
; library -- same free ride Salacia's main.cpp gets, no explicit -I needed
; here either. The guidance data model and the serial sentence parsers
; (GuidanceSource, GpsParser family, SerialGuidanceChannel) live in
; ../MeijWorks Libs/VehicleGuidance since NeptuneGPS_Triton#76 and reach this
; project through lib_extra_dirs like VehicleTractor does.
check_tool = cppcheck
; Scope analysis to code we actually own. Without this, `pio check` analysed the
; whole LDF dependency graph: 683 of the 687 findings came from vendored
; AgIsoStack/FlexCAN_T4 sources, including the only two HIGH ones
; (circular_buffer.hpp missingReturn) -- which is what failed the job under
; --fail-on-defect high, on third-party code we do not maintain.
;
; --skip-packages does NOT cover this: it skips *platform* packages (the Teensy
; core/toolchain), not lib_deps fetched into .pio/libdeps/. check_src_filters is
; the flag that does.
;
; Worse, lib/PloegbesturingCore -- every line of this project's real business
; logic -- was never analysed at all: it appeared nowhere in the component table,
; and a deliberately planted uninitialized-variable defect went undetected
; (verified 2026-09-08). `pio check` defaults to src_dir/include_dir only, so the
; library was silently out of scope while third-party noise filled the report.
; Naming it here is what actually gets it checked.
check_src_filters =
    +<src/>
    +<lib/PloegbesturingCore/>
; check_src_filters alone is not enough. It controls which *source* files are
; checked, but every AgIsoStack finding is in a .hpp/.tpp -- headers, pulled in
; through our own includes and analysed as part of whatever includes them. Adding
; the filter above actually made the vendored counts go UP (2->10 HIGH,
; 637->3185 LOW), because more of our files were being checked and each one
; re-reported the same third-party headers. Suppressing by path is what removes
; them; cppcheck still parses those headers for type information, it just stops
; reporting defects inside them.
; unusedFunction is suppressed, not fixed: `pio check` analyses one translation
; unit at a time, so it cannot see that a library method is called from
; main.cpp, and Arduino's setup()/loop() are invoked by the framework rather
; than by any code here. It accounted for 6 of 10 findings in Ploegbesturing and
; 38 of 47 in Ploegbesturing Isobus, all false. Leaving them in would be exactly
; the accumulated noise that made this job unreadable in the first place.
check_flags =
    cppcheck: --suppress=*:*/.pio/libdeps/* --suppress=unusedFunction
; Correction (2026-08-04, after re-reading PJRC forum thread 73201 / the real
; imxrt1062_t41.ld): ITCM and DTCM are NOT independent 512 KB banks -- they
; share one 512 KB / 16-block FlexRAM pool (DTCM's real size is whatever
; blocks ITCM doesn't claim; see _itcm_block_count/_estack in the linker
; script). teensy_size summing ITCM + DTCM against 512 KB was correct all
; along. This script instead patches teensy_size's exec_command to apply
; that same combined check (needed because the Teensy builder only prints
; stderr on a nonzero return code, and we want a clean pass/fail here too).
; Applies to both teensy41_isobus and teensy41_serial -- shared pool, shared risk.
extra_scripts = post:scripts/extra_script.py

; ISOBUS build: guidance data acquired over CAN via AgIsoStack (address claim,
; PGN subscriptions/requests), plus the Virtual Terminal client and diagnostics.
; Selected by -D ISOBUS -- see main.cpp's #ifdef ISOBUS branches.
[env:teensy41_isobus]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -D ISOBUS
; AgIsoStack owns the CAN peripheral directly (its own FlexCANT4Plugin, channel 0)
; -- ACAN_T4 is not needed. Registry id + exact API confirmed against a
; previously-working prototype (NeptuneGPS Documentation/Ploeg ISOBUS/), not guessed.
; Built straight from AgIsoStack-plus-plus (#189), through the library.json in
; its own repository: no Arduino packaging, no generated flat src/. History, so
; nobody walks back into it: the registry's open-agriculture/AgIsoStack@^0.1.0
; snapshot hung on boot (CANNetworkManager's static init on a runtime without
; std::mutex/thread); the AgIsoStack-Arduino port fixed that, but it is a
; hand-curated flattening of upstream that was last regenerated on 2024-10-13
; (upstream 29dab88) -- two years of upstream fixes behind by 2026-10. Upstream
; main now guards its threads itself (`!defined CAN_STACK_DISABLE_THREADS &&
; !defined ARDUINO`), which is what makes building it directly possible.
;
; Pinned by commit to our fork, Arjan-Woltjer/AgIsoStack-plus-plus, branch
; neptune-main: upstream main plus, as separate commits, the Teensy build support
; (library.json + platform guards, meant for upstream) and the patches the field
; needs that upstream does not have yet. Each is listed, with its upstream issue
; or PR, in NeptuneGPS Documentation/ISOBUS/research/AgIsoStackVendorPatches.md.
; As each lands upstream, rebase neptune-main onto upstream main, drop it from
; that file, and move this pin. Never hand-edit .pio/libdeps (#26).
lib_deps =
    https://github.com/Arjan-Woltjer/AgIsoStack-plus-plus.git#a9453ff78224602e17178bbfed3248c4c05ec5ee

; Teensy 4.0 board variant of the ISOBUS build. Same code, different pins:
; -D TEENSY40 selects the board branch in ConfigPlough.hpp / ConfigImplementPlough.hpp
; (CAN on FLEXCAN1 pins 22/23, bypass and FET 4 outputs on 2/3, plough-side
; input on 4). The 4.0 has the same MCU and the same 512 KB FlexRAM pool as
; the 4.1, so the teensy_size patch in extra_script.py applies unchanged.
[env:teensy40_isobus]
extends = env:teensy41_isobus
board = teensy40
build_flags =
    ${env:teensy41_isobus.build_flags}
    -D TEENSY40

; Serial build: guidance data acquired over plain UART (NMEA/Trimble/CAN-over-
; serial), no CAN bus, no AgIsoStack, no VT/diagnostics. Useful for
; installations/bench setups without full ISOBUS wiring.
[env:teensy41_serial]
extends = env:teensy41

; Triton01 board: ESP32-S3-WROOM-2 (16 MB octal flash, 8 MB octal PSRAM),
; selected with -D ESP32S3 in the config headers; TritonIo.hpp (MeijWorks
; Libs) carries the MCP23008 input expander those headers map onto. The
; debug console is the native USB CDC. Two variants, mirroring the Teensy
; pair: esp32s3_serial (UART guidance, no CAN) and esp32s3_isobus (AgIsoStack
; on the TWAI controller). Neither is in the CI matrix yet.
[env:esp32s3_serial]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = ../MeijWorks Libs
monitor_speed = 115200
board_build.arduino.memory_type = opi_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Same cppcheck scoping as [env:teensy41]: this env does not extend it, so the
; source scope and the vendored-library and unusedFunction suppressions have
; to be repeated here (the second libdeps pattern covers the relative,
; backslashed paths this platform reports).
check_src_filters =
    +<src/>
    +<lib/PloegbesturingCore/>
check_flags =
    cppcheck: --suppress=*:*/.pio/libdeps/* --suppress=*:*libdeps* --suppress=unusedFunction
build_flags =
    -std=gnu++17
    -D ESP32S3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ISOBUS on Triton01: the same AgIsoStack-plus-plus pin as teensy41_isobus;
; its library.json compiles the TWAI plugin (guarded by ESP_PLATFORM, which the
; Arduino-ESP32 core defines) and leaves the FlexCAN plugin out (guarded by the
; Teensy MCU macros). main.cpp constructs isobus::TWAIPlugin under ESP32S3.
[env:esp32s3_isobus]
extends = env:esp32s3_serial
build_flags =
    ${env:esp32s3_serial.build_flags}
    -D ISOBUS
lib_deps =
    https://github.com/Arjan-Woltjer/AgIsoStack-plus-plus.git#a9453ff78224602e17178bbfed3248c4c05ec5ee

; Native (host-compiled) AUnit test suite -- runs test/native's tests without
; a microcontroller attached. Needs a real host C++17 compiler (g++/clang++) on PATH;
; see test/README and reference-no-native-cpp-compiler if that's missing.
; test/native/support/ is a small, self-contained set of Arduino-shaped stubs
; (Print/Stream/EEPROM/etc.), not a real EpoxyDuino dependency -- EpoxyDuino's own
; cores/epoxy/main.cpp requires <termios.h>, which doesn't exist on Windows/MinGW,
; so it can't be used here at all (see test/README, "Why no EpoxyDuino"). AUnit
; itself has no such issue and is still resolved via lib_deps rather than vendored.
[env:native]
platform = native
; LDF builds its dependency graph starting from the default src_dir (src/main.cpp,
; since src_dir can't be overridden per-env) -- it would never see AUnit.h being
; used by the test_*.cpp files pulled in below via build_src_filter, and it would
; pull in the real MeijWorks Libs headers via main.cpp's own chain, defeating the
; support/ fakes. lib_ldf_mode = off makes every include path below fully explicit
; instead of relying on that mismatched auto-discovery.
lib_ldf_mode = off
build_flags =
    -std=gnu++17
    ; AUnit's own Assertion.cpp does `(unsigned long) somePointer` to print an address
    ; in hex -- a hard GCC error (not just a warning) under Windows' LLP64 model
    ; (unsigned long is 4 bytes, pointers are 8 on x86_64). Harmless upstream code,
    ; unmodified; never an issue on Linux (LP64) or under MSVC (run_tests_msvc.ps1).
    -fpermissive
    -D EPOXY_DUINO=1
    ; Searched first so a same-named native fake (InterfaceI2CLCD.hpp,
    ; VehicleTractor.hpp, Arduino.h/EEPROM.h) always wins over the real
    ; header it stands in for -- the one place shadowing still matters here,
    ; since these are external (MeijWorks Libs/Arduino framework) headers,
    ; not anything inside PloegbesturingCore's own tree.
    -I test/native/support
    -I .pio/libdeps/native/AUnit/src
    ; The only -I into PloegbesturingCore needed: every cross-file include
    ; inside the library itself is a relative path (e.g. ImplementPlough.hpp's
    ; "../config/ConfigImplementPlough.hpp"), matching Salacia's
    ; SalaciaFirmwareCore convention, so none of those depend on this at all --
    ; this single root is only for the test_*.cpp files below reaching in via
    ; library-root-relative paths ("implement/ImplementPlough.hpp" etc.), same
    ; role PlatformIO's LDF fills automatically for [env:teensy41]'s main.cpp
    ; (LDF is off here -- see lib_ldf_mode above -- so it must be explicit).
    -I lib/PloegbesturingCore/src
    ; The shared guidance library (NeptuneGPS_Triton#76). With the LDF off,
    ; lib_extra_dirs does nothing for this env, so its headers are reached
    ; the same explicit way and its .cpp files are listed in build_src_filter
    ; below. Real GuidanceSource, real parsers, real SerialGuidanceChannel --
    ; no native fake exists for any of them, so this is also where MeijWorks
    ; Libs' VehicleGuidance gets its test coverage (it has no test env of its
    ; own). Quoted: the directory name contains a space.
    -I "../MeijWorks Libs/VehicleGuidance"
    ; TritonIo.hpp, the header-only digital-input shim the plough core now
    ; reads its inputs through. Natively it compiles to the plain
    ; digitalRead() the Arduino.h stub mocks; only -D ESP32S3 builds pull in
    ; the MCP23008 code.
    -I "../MeijWorks Libs/TritonIo"
    ; The real AgIsoStack, compiled for the host (NeptuneGPS_Triton#98). Its
    ; core is portable C++17: no Arduino.h anywhere in it, std::chrono for
    ; time, and CANHardwarePlugin is a five-method interface a test can
    ; implement (support/FakeCanPlugin.hpp). Only flex_can_t4_plugin.cpp is
    ; Teensy-bound, and it is excluded in build_src_filter below.
    ;
    ; ISOBUS admits the isobus/ classes, whose headers are otherwise empty.
    ; CAN_STACK_DISABLE_THREADS makes thread_synchronization.hpp no-op its
    ; mutexes off-target, the same switch the ARDUINO build takes.
    ;
    ; AgIsoStack-plus-plus keeps its tree nested (#189): three include roots,
    ; the same ones its own library.json gives the Teensy build, so
    ; <isobus/isobus/...> resolves identically in both envs.
    -D ISOBUS
    -D CAN_STACK_DISABLE_THREADS
    -I .pio/libdeps/native/AgIsoStack__/isobus/include
    -I .pio/libdeps/native/AgIsoStack__/utility/include
    -I .pio/libdeps/native/AgIsoStack__/hardware_integration/include
lib_deps =
    bxparks/AUnit@^1.7.1
    https://github.com/Arjan-Woltjer/AgIsoStack-plus-plus.git#a9453ff78224602e17178bbfed3248c4c05ec5ee
; `pio check` runs over every env, and AgIsoStack's headers are now on this
; one's include path, so cppcheck parses them and reports what it finds inside
; them (data_span.hpp's uninitialised member, for one). Same path suppression
; [env:teensy41] carries, and for the same reason: findings in vendored code
; we do not maintain are what made this job unreadable before #32/#33. Without
; it this project stops reporting 0 MEDIUM, which is the property that keeps
; tightening the gate to medium on the table.
check_flags =
    cppcheck: --suppress=*:*/.pio/libdeps/* --suppress=unusedFunction
build_src_filter =
    -<*>
    +<../test/native/PloegbesturingNativeTests.cpp>
    +<../test/native/support/native_main.cpp>
    +<../test/native/tests/*.cpp>
    +<../.pio/libdeps/native/AUnit/src/aunit/*.cpp>
    +<../lib/PloegbesturingCore/src/implement/ImplementPlough.cpp>
    +<../lib/PloegbesturingCore/src/InterfacePlough.cpp>
    +<../lib/PloegbesturingCore/src/calibration/CalibrationPlough.cpp>
    +<../lib/PloegbesturingCore/src/isobus/VTObjectPool.cpp>
    +<../lib/PloegbesturingCore/src/isobus/IsobusTcInterface.cpp>
    +<../lib/PloegbesturingCore/src/isobus/IsobusGuidanceChannel.cpp>
    +<../lib/PloegbesturingCore/src/isobus/IsobusVtInterface.cpp>
    ; The AgIsoStack core: everything under isobus/ and utility/, and from
    ; hardware_integration/ only the hardware interface -- the rest there are
    ; drivers for real CAN hardware (FlexCAN, SocketCAN, PCAN, ...). Same glob
    ; shape as AUnit's above; see the build_flags note on #98.
    +<../.pio/libdeps/native/AgIsoStack__/isobus/src/*.cpp>
    +<../.pio/libdeps/native/AgIsoStack__/utility/src/*.cpp>
    +<../.pio/libdeps/native/AgIsoStack__/hardware_integration/src/can_hardware_interface.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/NmeaParser.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/TrimbleParser.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/CanSerialParser.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/SerialGuidanceChannel.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/IsobusPgnDecode.cpp>
    +<../../MeijWorks Libs/VehicleGuidance/CanFrameGuidanceChannel.cpp>
