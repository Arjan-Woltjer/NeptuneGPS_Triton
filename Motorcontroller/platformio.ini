[platformio]
; Build/Upload default to seeed_xiao; run the AUnit tests explicitly with
; "pio run -e native" (produces a runnable .exe under .pio/build/native/program.exe),
; or test\native\run_tests_msvc.ps1 on Windows without GCC.
default_envs = seeed_xiao

; Seeedstudio XIAO SAMD21 -- an 11-GPIO board, unlike every other Triton module (all
; Teensy 4.1). See ConfigMotorcontroller.hpp for the single-motor-only pin budget this
; forces. Not part of the Ploegbesturing-style CAN/ISOBUS implement family (no
; VehicleTractor/VehicleGps dependency, no MeijWorks Libs extra_dir needed) -- this is a
; standalone motor board talking its own serial protocol.
[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
lib_deps =
    cmaglie/FlashStorage
; SteeringActuator's PID/config/safety-interlock control algorithm is shared with
; NeptuneGPS Salacia's AutosteerSource so the two firmwares can't drift apart on it --
; see that library's own header for why. Lives outside this submodule (consumed by both
; Triton and Salacia) rather than under lib/, hence the extra_dirs entry.
lib_extra_dirs = ../../Shared Firmware Libs
check_tool = cppcheck

; Native (host-compiled) AUnit test suite -- runs test/native's tests without a
; microcontroller attached. Needs a real host C++17 compiler (g++/clang++) on PATH; see
; test/README and reference-no-native-cpp-compiler if that's missing.
[env:native]
platform = native
lib_ldf_mode = off
build_flags =
    -std=gnu++17
    -fpermissive
    -D EPOXY_DUINO=1
    -I test/native/support
    -I .pio/libdeps/native/AUnit/src
    -I lib/MotorcontrollerCore/src
    -I "../../Shared Firmware Libs/SteeringActuator/src"
lib_deps =
    bxparks/AUnit@^1.7.1
build_src_filter =
    -<*>
    +<../test/native/MotorcontrollerNativeTests.cpp>
    +<../test/native/support/native_main.cpp>
    +<../test/native/tests/*.cpp>
    +<../.pio/libdeps/native/AUnit/src/aunit/*.cpp>
    +<../lib/MotorcontrollerCore/src/InterfaceMotorcontroller.cpp>
    +<../../Shared Firmware Libs/SteeringActuator/src/SteeringActuator.cpp>
