[platformio]
; Build/Upload default to seeed_xiao; run the AUnit tests explicitly with
; "pio run -e native" (produces a runnable .exe under .pio/build/native/program.exe),
; or test\native\run_tests_msvc.ps1 on Windows without GCC.
default_envs = seeed_xiao

; Seeedstudio XIAO SAMD21 -- an 11-GPIO board, unlike every other Triton module (all
; Teensy 4.1). See ConfigMotorcontroller.hpp for the single-motor-only pin budget this
; forces. Not part of the Ploegbesturing-style CAN/ISOBUS implement family (no
; VehicleTractor/VehicleGps dependency, no MeijWorks Libs extra_dir needed) -- this is a
; standalone motor board talking its own serial protocol.
[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
lib_deps =
    cmaglie/FlashStorage
; SteeringActuator's PID/config/safety-interlock control algorithm is shared with
; NeptuneGPS Salacia's AutosteerSource so the two firmwares can't drift apart on it --
; see that library's own header for why. Consumed as a real git submodule
; (lib/SteeringActuator, github.com/Arjan-Woltjer/SteeringActuator) rather than a copy,
; so CI and the Copilot coding agent -- which only ever check out this repo standalone,
; not the old sibling Shared Firmware Libs directory -- can see the real source too.
check_tool = cppcheck
; Scope analysis to code we own. Without check_src_filters, `pio check` only
; looks at src_dir/include_dir, so lib/MotorcontrollerCore -- this project's real
; logic -- would never be analysed at all. unusedFunction is suppressed because
; `pio check` analyses one translation unit at a time and so cannot see a library
; method called from main.cpp, and Arduino's setup()/loop() are invoked by the
; framework. --inline-suppr lets `// cppcheck-suppress <id> ; reason` comments
; work where a finding is deliberate. See NeptuneGPS_Triton#32/#33.
;
; SteeringActuator is deliberately NOT listed: it is our code, but it lives in
; its own repository with its own CI and native suite and is analysed there.
; Checking it from both consumers (here and NeptuneGPS Salacia) would mean
; fixing the same finding twice and risking divergent suppressions.
check_src_filters =
    +<src/>
    +<lib/MotorcontrollerCore/>
check_flags =
    cppcheck: --inline-suppr --suppress=*:*/.pio/libdeps/* --suppress=*:*/lib/SteeringActuator/* --suppress=unusedFunction

; Native (host-compiled) AUnit test suite -- runs test/native's tests without a
; microcontroller attached. Needs a real host C++17 compiler (g++/clang++) on PATH; see
; test/README and reference-no-native-cpp-compiler if that's missing.
[env:native]
platform = native
lib_ldf_mode = off
build_flags =
    -std=gnu++17
    -fpermissive
    -D EPOXY_DUINO=1
    -I test/native/support
    -I .pio/libdeps/native/AUnit/src
    -I lib/MotorcontrollerCore/src
    -I lib/SteeringActuator/src
lib_deps =
    bxparks/AUnit@^1.7.1
build_src_filter =
    -<*>
    +<../test/native/MotorcontrollerNativeTests.cpp>
    +<../test/native/support/native_main.cpp>
    +<../test/native/tests/*.cpp>
    +<../.pio/libdeps/native/AUnit/src/aunit/*.cpp>
    +<../lib/MotorcontrollerCore/src/InterfaceMotorcontroller.cpp>
    +<../lib/SteeringActuator/src/SteeringActuator.cpp>
