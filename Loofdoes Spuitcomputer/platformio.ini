; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Without this, "pio run" (and the IDE's Build button) builds every [env:...]
; section, including native — which always fails at link time (see test/README
; or ask about the native env). Build/Upload default to esp32dev; run native
; explicitly with "pio run -e native" or "pio test -e native" for the AUnit tests.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = custom
lib_deps = bxparks/AUnit@^1.7.1
lib_extra_dirs = ../MeijWorks Libs
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_echo = 0

[env:native]
platform = native
; Requires GCC on the system PATH (e.g. install via MSYS2 on Windows).
; On Windows without GCC, use test\run_tests_msvc.ps1 instead.
lib_deps = bxparks/AUnit@^1.7.1
; Arduino stubs + EPOXY_DUINO so AUnit can compile and call exit() when done
build_flags = -DEPOXY_DUINO=1 -I test/arduino_stubs
; Compile only InterfaceSprayer.cpp from src/; exclude main.cpp and ImplementSprayer.cpp
build_src_filter = -<*> +<InterfaceSprayer.cpp> +<ImplementSprayer.cpp>