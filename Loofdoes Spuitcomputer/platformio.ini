[platformio]
; Without this, "pio run" (and the IDE's Build button) builds every [env:...] section,
; including the native one -- pio test's own Unity-based unit-testing subsystem doesn't
; understand this project's AUnit/custom setup at all (ignores test_framework = custom).
; Build/Upload default to esp32dev; run the AUnit tests explicitly with "pio run -e native"
; (produces a runnable .exe under .pio/build/native/program.exe), or
; test\native\run_tests_msvc.ps1 on Windows without GCC.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; AUnit isn't one of PlatformIO's built-in known test frameworks (Unity/Google Test/doctest) --
; "custom" means don't inject one of those runners, just compile whatever's here as-is.
test_framework = custom
lib_deps = bxparks/AUnit@^1.7.1
; Shared code with sibling Triton projects lives in ../MeijWorks Libs, referenced instead of
; copied per-project -- PlatformIO's LDF picks each library there up like any registry dependency.
lib_extra_dirs = ../MeijWorks Libs
monitor_speed = 115200
check_tool = cppcheck

; Native (host-compiled) AUnit test binary -- combines every test/native/tests/*.cpp file plus
; LoofdoesNativeTests.cpp (the single setup()/loop() driver, see that file) into one binary,
; matching Salacia's test/native/SalaciaNativeTests.cpp pattern. Requires GCC on the system
; PATH (e.g. install via MSYS2 on Windows). On Windows without GCC, use
; test\native\run_tests_msvc.ps1 instead.
;
; lib_ldf_mode = off + the fully explicit -I/build_src_filter entries below exist because LDF's
; dependency graph is rooted at src_dir's *original* file set (main.cpp) -- that doesn't
; reference AUnit.h, only the test/native/tests/*.cpp files pulled in via build_src_filter do,
; which LDF never scans. Without this, AUnit's own src/aunit/*.cpp sources never get compiled
; and the link fails on undefined aunit:: symbols.
[env:native]
platform = native
lib_ldf_mode = off
build_flags =
    -std=gnu++17
    ; AUnit's own Assertion.cpp does `(unsigned long) somePointer` to print an address in hex --
    ; a hard GCC error (not just a warning) under Windows' LLP64 model (unsigned long is 4
    ; bytes, pointers are 8 on x86_64). Harmless upstream code, unmodified; never an issue on
    ; Linux (LP64) or under test\native\run_tests_msvc.ps1's MSVC build.
    -fpermissive
    -D EPOXY_DUINO=1
    -I test/native/support
    -I .pio/libdeps/native/AUnit/src
    -I lib/LoofdoesCore/src
lib_deps = bxparks/AUnit@^1.7.1
build_src_filter =
    -<*>
    +<../test/native/LoofdoesNativeTests.cpp>
    +<../test/native/support/native_main.cpp>
    +<../test/native/tests/*.cpp>
    +<../.pio/libdeps/native/AUnit/src/aunit/*.cpp>
    +<../lib/LoofdoesCore/src/InterfaceSprayer.cpp>
    +<../lib/LoofdoesCore/src/ImplementSprayer.cpp>