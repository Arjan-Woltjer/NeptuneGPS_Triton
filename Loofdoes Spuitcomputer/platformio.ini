[platformio]
; Without this, "pio run" (and the IDE's Build button) builds every [env:...] section,
; including the native ones -- env:native itself always fails at link time (it's a template,
; not a real target), and pio test's own Unity-based unit-testing subsystem doesn't understand
; this project's AUnit/custom setup at all (ignores test_framework = custom). Build/Upload
; default to esp32dev; run the AUnit tests explicitly with "pio run -e native_interface_sprayer"
; and "pio run -e native_implement_sprayer" (each produces its own runnable .exe under
; .pio/build/<env>/program.exe), or test\native\run_tests_msvc.ps1 on Windows without GCC.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; AUnit isn't one of PlatformIO's built-in known test frameworks (Unity/Google Test/doctest) --
; "custom" means don't inject one of those runners, just compile whatever's here as-is.
test_framework = custom
lib_deps = bxparks/AUnit@^1.7.1
; Shared code with sibling Triton projects lives in ../MeijWorks Libs, referenced instead of
; copied per-project -- PlatformIO's LDF picks each library there up like any registry dependency.
lib_extra_dirs = ../MeijWorks Libs
monitor_speed = 115200
check_tool = cppcheck

; Shared template for the two native (host-compiled) AUnit test binaries below -- not meant to
; be built directly. Requires GCC on the system PATH (e.g. install via MSYS2 on Windows). On
; Windows without GCC, use test\native\run_tests_msvc.ps1 instead.
;
; lib_ldf_mode = off + the fully explicit -I/build_src_filter entries in each env below exist
; because LDF's dependency graph is rooted at src_dir's *original* file set (main.cpp) -- that
; doesn't reference AUnit.h, only the test/native/tests/*.cpp files pulled in via
; build_src_filter do, which LDF never scans. Without this, AUnit's own src/aunit/*.cpp sources
; never get compiled and the link fails on undefined aunit:: symbols.
[env:native]
platform = native
lib_ldf_mode = off
build_flags =
    -std=gnu++17
    ; AUnit's own Assertion.cpp does `(unsigned long) somePointer` to print an address in hex --
    ; a hard GCC error (not just a warning) under Windows' LLP64 model (unsigned long is 4
    ; bytes, pointers are 8 on x86_64). Harmless upstream code, unmodified; never an issue on
    ; Linux (LP64) or under test\native\run_tests_msvc.ps1's MSVC build.
    -fpermissive
    -D EPOXY_DUINO=1
    -I test/native/support
    -I .pio/libdeps/native/AUnit/src
    -I lib/LoofdoesCore/src
lib_deps = bxparks/AUnit@^1.7.1

; test_InterfaceSprayer.cpp and test_ImplementSprayer.cpp each define their own setup()/loop()
; (PlatformIO's "one test file = one binary" idiom, same as test\native\run_tests_msvc.ps1's two
; separate `cl` invocations) -- they can't be linked together into one combined binary, hence
; two separate envs rather than one that pulls in both test files.
[env:native_interface_sprayer]
extends = env:native
build_src_filter =
    -<*>
    +<../lib/LoofdoesCore/src/InterfaceSprayer.cpp>
    +<../test/native/tests/test_InterfaceSprayer.cpp>
    +<../test/native/support/native_main.cpp>
    +<../.pio/libdeps/native/AUnit/src/aunit/*.cpp>

[env:native_implement_sprayer]
extends = env:native
build_src_filter =
    -<*>
    +<../lib/LoofdoesCore/src/InterfaceSprayer.cpp>
    +<../lib/LoofdoesCore/src/ImplementSprayer.cpp>
    +<../test/native/tests/test_ImplementSprayer.cpp>
    +<../test/native/support/native_main.cpp>
    +<../.pio/libdeps/native/AUnit/src/aunit/*.cpp>