[platformio]
; Without this, "pio run" (and the IDE's Build button) builds every [env:...] section,
; including the native one -- pio test's own Unity-based unit-testing subsystem doesn't
; understand this project's AUnit/custom setup at all (ignores test_framework = custom).
; Build/Upload default to esp32dev; run the AUnit tests explicitly with "pio run -e native"
; (produces a runnable .exe under .pio/build/native/program.exe), or
; test\native\run_tests_msvc.ps1 on Windows without GCC.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Shared code with sibling Triton projects lives in ../MeijWorks Libs, referenced instead of
; copied per-project -- PlatformIO's LDF picks each library there up like any registry dependency.
lib_extra_dirs = ../MeijWorks Libs
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_echo = 0
; Companion-app link (NeptuneGPS_Triton#46/#48). NimBLE rather than the core's
; bundled Bluedroid BLE: measured on this firmware, 648 KB vs 1,175 KB of flash
; for the same GATT service, and the difference is what leaves room for the
; WiFi + OTA work in #34 in the same 1.25 MB app slot.
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -std=gnu++17
check_tool = cppcheck
; Scope analysis to code we own, and keep it out of fetched dependencies.
; Without check_src_filters, `pio check` only looks at src_dir/include_dir --
; lib/LoofdoesCore, i.e. every line of this project's real logic, was never
; analysed at all while the job still reported green in CI. unusedFunction is
; suppressed because `pio check` analyses one translation unit at a time, so it
; cannot see that a library method is called from main.cpp, and Arduino's
; setup()/loop() are invoked by the framework. See NeptuneGPS_Triton#32/#33.
check_src_filters =
    +<src/>
    +<lib/LoofdoesCore/>
check_flags =
    cppcheck: --suppress=*:*/.pio/libdeps/* --suppress=unusedFunction

; Native (host-compiled) AUnit test suite -- runs test/native's tests without
; a microcontroller attached. Needs a real host C++17 compiler (g++/clang++) on PATH;
; see test/README.md and reference-no-native-cpp-compiler if that's missing.
; test/native/support/ is a small, self-contained set of Arduino-shaped stubs
; (Print/Stream/Wire/SPI/IPAddress/etc.), not a real EpoxyDuino dependency --
; EpoxyDuino's own cores/epoxy/main.cpp requires <termios.h>, which doesn't
; exist on Windows/MinGW, so it can't be used here at all (see test/README.md,
; "Why no EpoxyDuino"). AUnit itself has no such issue and is still resolved
; via lib_deps rather than vendored.
[env:native]
platform = native
; LDF builds its dependency graph starting from the default src_dir (
; src/main.cpp, since src_dir can't be overridden per-env) -- it would
; never see AUnit.h being used by the test_*.cpp files pulled in below via
; build_src_filter, and it would pull in lib/FlasherX's real (hardware-only)
; headers via main.cpp's own chain, defeating the support/FlashTxx.h fake.
; lib_ldf_mode = off makes every include path below fully explicit instead of
; relying on that mismatched auto-discovery -- same fully-manual approach the
; old Makefile took, just expressed as PlatformIO flags. support/ must be
; searched before AUnit's own include dir has any chance of shadowing (it
; doesn't currently, but keeping this first is the safe default).
lib_ldf_mode = off
build_flags =
    -std=gnu++17
    ; AUnit's own Assertion.cpp does `(unsigned long) somePointer` to print an address in hex --
    ; a hard GCC error (not just a warning) under Windows' LLP64 model (unsigned long is 4
    ; bytes, pointers are 8 on x86_64). Harmless upstream code, unmodified; never an issue on
    ; Linux (LP64) or under test\native\run_tests_msvc.ps1's MSVC build.
    -fpermissive
    -D EPOXY_DUINO=1
    -I test/native/support
    -I .pio/libdeps/native/AUnit/src
    -I lib/LoofdoesCore/src
lib_deps = 
    bxparks/AUnit@^1.7.1
build_src_filter =
    -<*>
    +<../test/native/LoofdoesNativeTests.cpp>
    +<../test/native/support/native_main.cpp>
    +<../test/native/tests/*.cpp>
    +<../.pio/libdeps/native/AUnit/src/aunit/*.cpp>
    +<../lib/LoofdoesCore/src/InterfaceSprayer.cpp>
    +<../lib/LoofdoesCore/src/ImplementSprayer.cpp>
    +<../lib/LoofdoesCore/src/ConfigSprayer.cpp>
    +<../lib/LoofdoesCore/src/RemoteSprayer.cpp>